name: CI

# The plugin decorates rendered Markdown and mounts a Host route, so both halves
# have a cheap regression suite: node-side cases, then the shipped bundle in a
# real browser. Both run on every push, which is the point — a DSH upgrade or a
# careless selector change should fail here rather than in someone's transcript.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Node-side suites (host route, cordis mount, browser-half behaviour)
        run: node test/run.mjs

      - name: Real-browser suite
        run: node test/run-e2e-headless.mjs

      - name: Publishable tarball shape
        run: node tools/pack-check.mjs

      # The vendored runtime is committed, so regenerating it must reproduce the
      # committed bytes; a difference means the build inputs or the build itself
      # drifted from what was shipped.
      - name: Vendored runtime is reproducible
        run: |
          npm run build
          git diff --exit-code -- vendor

      # A tag that does not match the manifest would publish the wrong version.
      - name: Version and tag agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json $version" >&2
            exit 1
          fi
          echo "tag and manifest agree on $version"

  # Building `vendor/` used to spawn `node_modules/.bin/esbuild`, which holds a
  # shell script plus a `.cmd` wrapper on Windows. This job exists so that a
  # Windows contributor's build path is verified rather than assumed; everything
  # else runs on the Linux job.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the vendored runtime
        run: npm run build

      - name: Publishable tarball shape
        run: node tools/pack-check.mjs
